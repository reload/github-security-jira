---
on: pull_request
name: Code style review
permissions:
  contents: read
jobs:
  php-versions:
    name: Lookup PHP versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: antfroger/php-version-action@v1
        id: versions

  review_codestyle:
    name: Codestyle
    runs-on: ubuntu-24.04
    needs: php-versions
    strategy:
      matrix:
        php-version: ${{ fromJSON(needs.php-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@master
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: cs2pr
      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-suggest --no-progress --prefer-dist
      - name: Check codestyle
        run: |
          vendor/bin/phpcs bin/ src/ --report=checkstyle | cs2pr

  static_code_analysis:
    name: Static Code Analysis
    runs-on: ubuntu-24.04
    needs: php-versions
    strategy:
      matrix:
        php-version: ${{ fromJSON(needs.php-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@master
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-suggest --no-progress --prefer-dist
      - name: Static code analysis
        run: |
          php -d memory_limit=1G vendor/bin/phpstan analyse . --error-format=github
